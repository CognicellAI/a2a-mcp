name: Conformance

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  client-bridge:
    name: Client and MCP bridge checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - "20"
          - "24"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - run: npm run lint:docs
      - run: npm pack --dry-run
